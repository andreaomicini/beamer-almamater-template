# Builds the template once per preset, and releases the six PDFs together on every push to main that
# changes them: almamater-template.zip as <version>-<UTC stamp>, here and on GitHub (ci/release.py).
# The preset is chosen at build time: -usepretex defines \almamaterpreset before the file's own default.

variables:
  PRESETS: "AMSUniBo AMSBolognaFC AMSCesena AMSPurpleAndGold AMSRedGrey AMSSilverBlue"

.changes: &changes
  - almamater-template.tex
  - almamater-template.bib
  - presets/**/*
  - .latexmkrc
  - .gitmodules
  - .gitlab-ci.yml
  - .style
  - ci/*

build:
  image: texlive/texlive:latest
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - changes: *changes
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - for p in $PRESETS; do latexmk -pdf -file-line-error -interaction=nonstopmode -halt-on-error -jobname=almamater-template-$p -usepretex="\def\almamaterpreset{$p}" almamater-template.tex || exit 1; done
  artifacts:
    name: almamater-template
    paths:
      - almamater-template-*.pdf
    expire_in: 4 weeks

release:
  stage: deploy
  image: python:3-alpine
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - changes: *changes
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - apk add --no-cache zip
    - zip almamater-template.zip almamater-template-*.pdf
    - python3 ci/release.py almamater-template.tex almamater-template.zip "almamater Beamer template"

include:
  - project: andrea.omicini/beamer-almamater
    file: /ci/style-lag.gitlab-ci.yml
